<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>V我50，看看实力</title>
<style>
  :root {
    --green: #07c160;
    --green-deep: #06ad56;
    --ink: #1a1a1a;
    --muted: #7a7a7a;
    --card: #ffffff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 28px 20px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 620px at 50% -12%, #12d46c 0%, #07c160 42%, #06b055 62%, #eef2f0 62.2%, #e9efec 100%);
    background-attachment: fixed;
    min-height: 100%;
  }

  /* ---------- 标题 ---------- */
  .headline {
    text-align: center;
    animation: pop .6s cubic-bezier(.2, .9, .3, 1.3) both;
  }

  .headline h1 {
    margin: 0;
    font-size: clamp(34px, 10vw, 62px);
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 4px 0 rgba(0, 80, 35, .18), 0 14px 34px rgba(0, 0, 0, .18);
  }

  .headline h1 .v {
    background: linear-gradient(180deg, #fff6b0 0%, #ffd23f 55%, #ff9f1a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1px rgba(120, 60, 0, .25);
    padding: 0 .06em;
  }

  .headline h1 .shine {
    background: linear-gradient(100deg, #ffd23f 30%, #fffbe6 45%, #ffd23f 60%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1px rgba(120, 60, 0, .25);
    animation: shine 2.6s linear infinite;
  }

  .headline p {
    margin: 12px 0 0;
    font-size: clamp(14px, 3.6vw, 17px);
    color: rgba(255, 255, 255, .92);
    letter-spacing: 3px;
    font-weight: 500;
  }

  /* ---------- 收款卡片 ---------- */
  .card {
    width: min(420px, 100%);
    background: var(--card);
    border-radius: 26px;
    padding: 30px 26px 26px;
    text-align: center;
    box-shadow:
      0 2px 0 rgba(255, 255, 255, .7) inset,
      0 26px 60px rgba(4, 60, 30, .22),
      0 4px 14px rgba(0, 0, 0, .08);
    animation: rise .7s .1s cubic-bezier(.2, .9, .3, 1.15) both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 15px;
    border-radius: 999px;
    background: #eaf9f0;
    color: var(--green-deep);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  .badge::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(7, 193, 96, .18);
    animation: blink 1.4s ease-in-out infinite;
  }

  .qr-wrap {
    margin: 20px auto 6px;
    width: min(300px, 78vw);
    aspect-ratio: 1 / 1;
    padding: 10px;
    border-radius: 20px;
    background: #fff;
    border: 1px solid #eef0ef;
    position: relative;
  }

  .qr-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    border-radius: 12px;
  }

  /* 扫描线 */
  .qr-wrap::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px;
    height: 3px;
    top: 12px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: .85;
    animation: scan 2.4s ease-in-out infinite;
    pointer-events: none;
  }

  .card .name {
    margin: 14px 0 2px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .card .tip {
    margin: 0;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ---------- 按钮 ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    width: min(420px, 100%);
    animation: rise .7s .2s cubic-bezier(.2, .9, .3, 1.15) both;
  }

  .btn {
    flex: 1 1 160px;
    border: 0;
    cursor: pointer;
    padding: 15px 22px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    font-family: inherit;
    transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
  }

  .btn-primary {
    color: #fff;
    background: linear-gradient(180deg, #10d06a, var(--green-deep));
    box-shadow: 0 10px 24px rgba(6, 173, 86, .38);
  }

  .btn-ghost {
    color: var(--green-deep);
    background: #fff;
    box-shadow: 0 10px 24px rgba(4, 60, 30, .16);
  }

  .btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
  .btn:active { transform: translateY(1px) scale(.985); }

  .footer {
    font-size: 12.5px;
    color: rgba(255, 255, 255, .9);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .18);
    letter-spacing: .5px;
    animation: rise .7s .3s cubic-bezier(.2, .9, .3, 1.15) both;
  }

  /* ---------- 吐司 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translate(-50%, 24px);
    background: rgba(20, 20, 20, .9);
    color: #fff;
    font-size: 14.5px;
    padding: 12px 20px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    backdrop-filter: blur(6px);
    max-width: 82vw;
    text-align: center;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shine { from { background-position: 200% 0; } to { background-position: -60% 0; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes scan { 0% { top: 12px; } 50% { top: calc(100% - 15px); } 100% { top: 12px; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 380px) {
    .card { padding: 24px 18px 20px; border-radius: 20px; }
    .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>

  <header class="headline">
    <h1><span class="v">V</span>我<span class="shine">50</span>，看看实力</h1>
    <p>扫码即到 · 童叟无欺</p>
  </header>

  <main class="card">
    <span class="badge">微信收款码</span>

    <div class="qr-wrap">
      <img src="wechat-pay.png" alt="微信收款二维码 — Kira(**伦)" />
    </div>

    <p class="name">Kira(**伦)</p>
    <p class="tip">打开微信 → 扫一扫 → 输入金额 50<br />付款后截图，实力自证</p>
  </main>

  <div class="actions">
    <button class="btn btn-primary" id="payBtn">我要 V 50</button>
    <button class="btn btn-ghost" id="copyBtn">复制收款人</button>
  </div>

  <p class="footer">本页面仅供娱乐 · 请勿当真</p>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const toastEl = document.getElementById('toast');
  let toastTimer;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  document.getElementById('payBtn').addEventListener('click', async () => {
    const img = document.querySelector('.qr-wrap img');
    img.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.045)' }, { transform: 'scale(1)' }],
      { duration: 520, easing: 'ease-out' }
    );
    toast('长按/右键二维码保存，或直接微信扫一扫 ✅');
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const name = 'Kira(**伦)';
    try {
      await navigator.clipboard.writeText(name);
      toast('已复制收款人：' + name);
    } catch {
      toast('收款人：' + name);
    }
  });
</script>
</body>
</html>
